name: release-please

# Maintains a rolling "release PR" off main: it accrues every Conventional
# Commit into CHANGELOG.md and bumps the workspace version. Merging that PR
# tags `vX.Y.Z`, which in turn triggers release.yml to build the bundles.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
