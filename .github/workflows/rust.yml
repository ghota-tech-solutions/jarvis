name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Linux needs protoc plus the GTK/WebKit system libs that the
      # `jarvis-desktop` (Tauri 2) crate links against — `cargo clippy
      # --workspace` builds every crate, so glib-sys et al. must resolve.
      - name: Install Linux system deps (protoc + Tauri/GTK)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            patchelf libxdo-dev
      # protoc on Windows is provided by protoc-bin-vendored in build.rs.
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - run: cargo test --workspace --no-fail-fast
