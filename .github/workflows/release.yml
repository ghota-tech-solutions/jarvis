name: release

# Builds installable bundles for Windows / macOS / Linux and attaches them
# to the GitHub release for a given tag. Invoked by release-please.yml once
# a release is cut, by a manually pushed vX.Y.Z tag, or manually from the
# Actions tab. Bundles are UNSIGNED — Windows SmartScreen / macOS Gatekeeper
# will warn; documented in README §Install.

on:
  # Called by release-please.yml after it cuts a release.
  workflow_call:
    inputs:
      tag:
        description: Tag whose GitHub release the bundles attach to.
        type: string
        required: false
        default: ''
  # Manual run: pass a tag to build + attach bundles to that release, or
  # leave it empty for a dry-run build that publishes nothing.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build bundles for and attach them to.
        type: string
        required: false
        default: ''
  # A manually pushed tag builds + publishes on its own.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb,appimage,rpm
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle_args: --bundles dmg,app
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle_args: --bundles dmg,app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Linux: tauri AppImage + deb + rpm need a few system libs.
      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            patchelf libxdo-dev

      - name: Install protoc (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y protobuf-compiler

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build SPA frontend
        working-directory: crates/jarvis-web/ui
        run: |
          bun install --frozen-lockfile
          bun run gen
          bun run build

      - name: Build Tauri bundle
        working-directory: crates/jarvis-desktop
        run: cargo tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Hoover up whatever Tauri produced for this target.
          # `target/{TARGET}/release/bundle/{type}/...` is the canonical layout.
          find target/${{ matrix.target }}/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # Attach the built bundles to the release for this tag. Skipped on a
    # tag-less dry-run dispatch.
    if: ${{ inputs.tag != '' || github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # release-please already created the GitHub release (with the
      # CHANGELOG body) for this tag — we only upload the bundles onto it.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: false
