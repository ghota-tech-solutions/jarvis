name: release

# Builds installable bundles for Windows / macOS / Linux on every tag
# vX.Y.Z and attaches them to the GitHub release that release-please
# already created for that tag. Bundles are UNSIGNED — Windows
# SmartScreen / macOS Gatekeeper will warn; documented in README §Install.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  # Lets us trigger a dry-run release build from the Actions tab without
  # cutting a tag. Doesn't publish anything when run this way.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb,appimage,rpm
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle_args: --bundles dmg,app
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle_args: --bundles dmg,app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: --bundles msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Linux: tauri AppImage + deb + rpm need a few system libs.
      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            patchelf libxdo-dev

      - name: Install protoc (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y protobuf-compiler

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build SPA frontend
        working-directory: crates/jarvis-web/ui
        run: |
          bun install --frozen-lockfile
          bun run gen
          bun run build

      - name: Build Tauri bundle
        working-directory: crates/jarvis-desktop
        run: cargo tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Hoover up whatever Tauri produced for this target.
          # `target/{TARGET}/release/bundle/{type}/...` is the canonical layout.
          find target/${{ matrix.target }}/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' \
            -o -name '*.dmg' -o -name '*.app.tar.gz' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    # On a tag, attach the built bundles to the release that release-please
    # already created. workflow_dispatch builds the artifacts (above) but
    # stops here.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # release-please already created the GitHub release (with the
      # CHANGELOG body) for this tag — we only upload the bundles to it.
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: false
