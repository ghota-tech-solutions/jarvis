[package]
name = "jarvis-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jarvis: long-running daemon, hosts gRPC server."

[[bin]]
name = "jarvis-daemon"
path = "src/main.rs"

[dependencies]
jarvis-core.workspace = true
jarvis-api.workspace = true
jarvis-config.workspace = true
jarvis-llm.workspace = true
jarvis-ledger.workspace = true
jarvis-tools.workspace = true
jarvis-sandbox.workspace = true
jarvis-mcp.workspace = true
jarvis-agent.workspace = true
jarvis-web.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tonic-web.workspace = true
git2.workspace = true
similar.workspace = true
cron.workspace = true
prost.workspace = true
async-trait.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
chrono.workspace = true
regex.workspace = true
notify = "8"
notify-debouncer-mini = "0.7"

[features]
default = []
# § T2.9 — opt-in browser sidecar. Propagates to jarvis-tools so the
# three browser_* tools get compiled in and registered. Build with
# `cargo build -p jarvis-daemon --features browser`.
browser = ["jarvis-tools/browser"]

[dev-dependencies]
tempfile = "3"
