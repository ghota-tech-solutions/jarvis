[package]
name = "jarvis-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jarvis: minimal MCP (Model Context Protocol) JSON-RPC client + Tool adapter."

[dependencies]
jarvis-core.workspace = true
jarvis-tools.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true
thiserror.workspace = true

[[bin]]
name = "mcp-mock"
path = "src/bin/mcp_mock.rs"

[[bin]]
name = "mcp-bench"
path = "src/bin/mcp_bench.rs"
