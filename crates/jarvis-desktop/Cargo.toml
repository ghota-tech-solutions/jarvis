[package]
name = "jarvis-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jarvis desktop app — Tauri 2 wrapper around the SolidJS SPA, ships the daemon as a sidecar."

[[bin]]
name = "jarvis-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
which = "8"

# Used only by `examples/gen_icons.rs` (icon ladder generation).
# Kept out of the shipped binary to avoid bloating it with SVG/ICNS deps.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.45"
ico = "0.5"
icns = "0.4"

[[example]]
name = "gen_icons"
path = "examples/gen_icons.rs"
