syntax = "proto3";

package jarvis.v1;

// Jarvis daemon gRPC API.
// M1: Ping, Ask.
// M2: SubmitTask, GetTask, ListTasks, StreamEvents, CancelTask.
service Jarvis {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Ask(AskRequest) returns (stream AskChunk);

  rpc SubmitTask(TaskSpec) returns (TaskHandle);
  rpc GetTask(TaskHandle) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (TaskList);
  rpc CancelTask(TaskHandle) returns (Empty);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);

  // M5: daemon-wide status snapshot (models, uptime, running tasks).
  rpc GetStatus(StatusRequest) returns (DaemonStatus);

  // M6: full event timeline + pre-computed spans for a task. With
  // `include_ancestors`, the SPA's conversation-thread view merges the
  // parent chain so follow-up tasks render as one continuous transcript.
  rpc GetTimeline(GetTimelineRequest) returns (TimelineSnapshot);

  // M7: continuously streamed view of the whole task fleet. The first frame
  // on subscription is always a full `FleetSnapshot`; subsequent frames are
  // `FleetDelta`s carrying only added/updated/removed nodes and edges. This
  // keeps long-lived dashboards cheap on bandwidth and on SPA re-renders.
  // (M7.1)
  rpc StreamFleet(Empty) returns (stream FleetFrame);

  // M7: aggregated cost breakdown for a task and its descendant subtasks,
  // grouped by model.
  rpc GetTaskCostBreakdown(TaskHandle) returns (CostReport);

  // M8: diff-by-intent — file changes for a task, grouped by the parent
  // `decision` event that authored them. Drives the phase-gated diff UI.
  // The returned `FileDiff` rows carry metadata only; the SPA lazily
  // streams the unified-diff text for each file via `GetFileDiff`.
  rpc GroupDiffByIntent(TaskHandle) returns (DiffGroupList);

  // M8.1: paginated unified-diff for a single file in a phase. The SPA
  // calls this when the user expands a file in DiffByIntent. Large diffs
  // (refactors, generated code) used to blow up `GroupDiffByIntent`'s
  // response; now the heavy bytes are fetched on demand, chunk-by-chunk.
  rpc GetFileDiff(GetFileDiffRequest) returns (FileDiffChunkBatch);

  // M8: atomic git commit for one diff group. The agent's decision text
  // becomes the commit message body; the user can edit the subject.
  rpc CommitPhase(CommitPhaseRequest) returns (CommitInfo);

  // M8: revert one diff group's file edits (best-effort; works only if
  // the files have not been touched outside the agent since).
  rpc RejectPhase(CommitPhaseRequest) returns (Empty);

  // M9: long-term learned facts about the user / project. The agent
  // proposes candidates on verdict; the user promotes / edits / forgets.
  rpc ListMemories(ListMemoriesRequest) returns (MemoryList);
  rpc PromoteMemory(PromoteMemoryRequest) returns (Memory);
  rpc ForgetMemory(MemoryHandle) returns (Empty);
  rpc EditMemory(EditMemoryRequest) returns (Memory);

  // M12.S1: scheduled tasks — cron-style runs. Drives overnight workflows
  // ("review PRs every 2h", "lint and commit format fixes nightly").
  rpc CreateSchedule(ScheduleSpec) returns (Schedule);
  rpc ListSchedules(Empty) returns (ScheduleList);
  rpc DeleteSchedule(ScheduleHandle) returns (Empty);
  rpc RunScheduleNow(ScheduleHandle) returns (TaskHandle);
}

// ---------- M1 ----------

message PingRequest {}
message PingResponse {
  string version = 1;
  int64 uptime_seconds = 2;
}

message AskRequest {
  string prompt = 1;
  string provider = 2;
  optional float temperature = 3;
  optional uint32 max_tokens = 4;
}

message AskChunk {
  string delta = 1;
  optional UsageStats usage = 2;
  optional string finish_reason = 3;
}

message UsageStats {
  uint32 prompt_tokens = 1;
  uint32 completion_tokens = 2;
  uint32 total_tokens = 3;
}

// ---------- M2 ----------

message Empty {}

message TaskHandle {
  // UUID v4 of the task, as a hyphenated string.
  string id = 1;
}

message TaskSpec {
  string goal = 1;
  // Working directory the agent operates on. Resolved relative to daemon cwd.
  string workdir = 2;
  // Optional cap on agent loop iterations (defaults to a sane value if 0).
  uint32 max_steps = 3;
  // M3: sandbox backend. "" → config default, "native", "docker".
  string sandbox = 4;
  // M3: network policy when sandbox == docker. "" → "egress_only",
  // valid: "none" | "egress_only" | "full".
  string net_policy = 5;
  // M3: if true and workdir is inside a git repo, create a fresh worktree.
  bool use_worktree = 6;
  // M3: optional git ref to branch from. Defaults to HEAD.
  string base_ref = 7;
  // M5: routing policy. "" → config default; "auto"|"local_only"|"remote_only"
  // |"model:<name>" (strict force).
  string routing_policy = 8;
  // M5: required capabilities. Recognised entries: "tool_calls", "json_schema",
  // "vision". Pool will filter candidate models accordingly.
  repeated string require_caps = 9;
  // M5.6: parent task id. When set, the new task is created as a child:
  // the parent's worktree/sandbox/net_policy are inherited if the corresponding
  // fields are left empty, and the ledger records the parent link so the TUI
  // can render a chronological conversation across the chain.
  string parent_task_id = 10;
  // M10.S4: resume a previously-interrupted task. When set, the new task
  // inherits workdir/sandbox/net_policy/worktree from `resume_from`, sets
  // parent_task_id = resume_from so the agent loop's history walker carries
  // the full prior context, and logs a `continuation` event referencing the
  // source. `goal`, `sandbox`, etc. on this spec override the inherited
  // values when non-empty.
  string resume_from = 11;
}

// ---------- Status / model registry ----------

message StatusRequest {}

message DaemonStatus {
  string version = 1;
  int64 uptime_seconds = 2;
  repeated ModelStatus models = 3;
  uint32 running_tasks = 4;
  // § F2.7 — connected MCP servers + their tool catalogs, so the SPA's
  // MCP Tool Explorer can render the inventory without a separate RPC.
  repeated McpServerStatus mcp_servers = 5;
}

message McpServerStatus {
  string name = 1;
  bool connected = 2;
  // Auto-qualified tool names already prefixed by `<server>.` so they
  // match what the agent loop sees.
  repeated string tools = 3;
  // Empty when the server connected cleanly; populated with the
  // initialise / tools-list error otherwise.
  string error = 4;
}

message ModelStatus {
  string name = 1;
  string kind = 2;          // "local" | "remote"
  string model_id = 3;
  int32 priority = 4;
  bool online = 5;
  bool quarantined = 6;
  int64 quarantined_until_micros = 7;
  uint32 failures_in_window = 8;
  uint32 ctx_len = 9;
  bool tool_calls = 10;
  bool json_schema = 11;
  bool vision = 12;
}

message Task {
  string id = 1;
  string goal = 2;
  string status = 3;     // pending | running | completed | failed | cancelled
  string workdir = 4;
  int64 created_at = 5;  // unix micros
  optional int64 completed_at = 6;
  optional string error = 7;
  // M3:
  string sandbox = 8;            // backend that ran the task
  string net_policy = 9;
  string worktree_path = 10;     // empty if no worktree was created
  string worktree_branch = 11;
  // M6.5: parent task id (UUID) when this task is a follow-up; empty for roots.
  string parent_task_id = 12;
}

message ListTasksRequest {
  // If true include completed/failed/cancelled tasks; otherwise only active ones.
  bool include_finished = 1;
  uint32 limit = 2;
}

message TaskList {
  repeated Task tasks = 1;
}

message StreamEventsRequest {
  // If empty, streams all events.
  string task_id = 1;
  // If true, keeps streaming new events as they arrive.
  bool follow = 2;
  // If non-zero, only events with id > since_id are returned.
  int64 since_id = 3;
  // M5.7: include events from the task's parent chain in backfill. The follow
  // stream only tails new events for `task_id` itself.
  bool include_ancestors = 4;
}

message Event {
  int64 id = 1;
  int64 ts_micros = 2;
  string task_id = 3;
  string agent_id = 4;      // empty if not agent-scoped
  string kind = 5;          // attempt|observation|decision|tool_call|tool_result|error|verdict|spawn|llm_chunk
  string subject = 6;       // empty if none
  // JSON-encoded payload (M2). May migrate to CBOR later.
  string payload_json = 7;
  int64 parent_evt = 8;     // 0 if none
}

// ---------- M6: Timeline ----------
//
// GetTimeline returns every event for a task + its descendant subtasks,
// plus pre-computed spans (tool_call→tool_result, attempt→verdict) so the
// SPA can render lanes with O(N) work. Min/max ts_micros are mirrored at the
// top level so the client can set up its scale without scanning the events.

message TimelineSnapshot {
  string task_id = 1;
  repeated TimelineEvent events = 2;
  repeated TimelineSpan spans = 3;
  int64 min_ts_micros = 4;
  int64 max_ts_micros = 5;
}

message GetTimelineRequest {
  string id = 1;
  // When true, prepend events from the task's ancestor chain so the
  // SPA can render a follow-up conversation as one transcript.
  bool include_ancestors = 2;
}

message TimelineEvent {
  int64 id = 1;
  int64 ts_micros = 2;
  string task_id = 3;
  string agent_id = 4;      // empty if not agent-scoped
  string kind = 5;
  string subject = 6;
  string payload_json = 7;
  int64 parent_evt = 8;     // 0 if none
}

message TimelineSpan {
  int64 start_evt_id = 1;
  int64 end_evt_id = 2;        // 0 if the span is still open (running)
  int64 start_ts_micros = 3;
  int64 end_ts_micros = 4;     // 0 if running
  string label = 5;             // short, ~40 chars
  string lane = 6;              // tools | llm | plan | verdict
  string outcome = 7;           // ok | error | running
}

// ---------- M7: Fleet + cost ----------

// One frame on the StreamFleet stream. The very first frame on a fresh
// subscription is always a `FleetSnapshot`; every subsequent frame is a
// `FleetDelta` carrying only what changed since the previous tick.
// Empty deltas are not sent — the stream stays silent until the daemon
// observes a real change. (M7.1)
message FleetFrame {
  // Wall-clock micros of when the frame was assembled. Mirrored on both
  // variants of the oneof to keep clients trivially monotonic.
  int64 ts_micros = 1;
  oneof kind {
    FleetSnapshot snapshot = 2;
    FleetDelta delta = 3;
  }
}

// Full state of the fleet at a point in time. Emitted as the first frame
// after a client connects and any time the daemon decides a delta would be
// larger than a fresh snapshot.
message FleetSnapshot {
  repeated FleetNode nodes = 1;
  repeated FleetEdge edges = 2;
}

// Incremental change since the previous frame. The SPA applies these on
// top of the snapshot it already holds:
//   - merge `added_nodes` and overwrite by task_id with `updated_nodes`
//   - remove any node whose id is in `removed_node_ids`
//   - merge `added_edges` and drop any edge in `removed_edges`
// Updated nodes carry full new state, not a diff of fields.
message FleetDelta {
  repeated FleetNode added_nodes = 1;
  repeated FleetNode updated_nodes = 2;
  repeated string removed_node_ids = 3;
  repeated FleetEdge added_edges = 4;
  repeated FleetEdge removed_edges = 5;
}

message FleetNode {
  string task_id = 1;
  string short_id = 2;          // first 8 chars of UUID, pre-computed
  string status = 3;             // pending | running | completed | failed | cancelled
  string goal = 4;
  string workdir = 5;
  string sandbox = 6;
  // Approximate token spend on this task (sum of llm_chunk usage if available;
  // otherwise 0). The CostReport RPC has the authoritative numbers.
  uint64 tokens_in = 7;
  uint64 tokens_out = 8;
  double estimated_cost_usd = 9;
  int64 created_at_micros = 10;
  int64 updated_at_micros = 11;  // ts of last event seen
  // "attention" flag — true when the task verdict failed or a continuation
  // was injected. Drives auto-bubble in the dashboard.
  bool needs_attention = 12;
}

message FleetEdge {
  // Directed edge from parent task to child task. Both are root in the DAG
  // when parent is empty.
  string parent_task_id = 1;
  string child_task_id = 2;
}

message CostReport {
  string task_id = 1;
  // Total token + dollar spend across the task and all its descendants.
  uint64 total_tokens_in = 2;
  uint64 total_tokens_out = 3;
  double total_cost_usd = 4;
  // Per-model breakdown for drill-in.
  repeated ModelSpend by_model = 5;
}

message ModelSpend {
  string model_name = 1;          // "local:gemma", "remote:deepseek_pro"
  uint64 tokens_in = 2;
  uint64 tokens_out = 3;
  double cost_usd = 4;            // 0 for local models
  uint32 call_count = 5;
}

// ---------- M8: Diff-by-intent + phase-gating ----------

message DiffGroupList {
  string task_id = 1;
  repeated DiffGroup groups = 2;
  // Files that exist on disk but couldn't be linked to a decision event.
  // Rare; surface as an "uncategorized" group in the UI.
  repeated string orphan_paths = 3;
}

message DiffGroup {
  // Event id of the decision that authored this group's edits.
  int64 decision_evt_id = 1;
  // Decision text — used as the default commit-message body.
  string decision_text = 2;
  // Step number (from the decision's payload) — drives the UI's
  // ordinal heading: "Phase 3 — …".
  uint32 step = 3;
  int64 ts_micros = 4;
  // Files touched in this group — metadata only. The SPA fetches each
  // file's unified-diff text on demand via `GetFileDiff`. (M8.1)
  repeated FileDiff files = 5;
}

// Per-file metadata for a phase's diff. Carries enough for the UI to
// render the file list (path, change kind, line counts) but never the
// full diff body — large refactors used to balloon the response.
message FileDiff {
  string path = 1;
  // "added" | "modified" | "deleted"
  string change_kind = 2;
  uint32 lines_added = 3;
  uint32 lines_removed = 4;
  // Total number of unified-diff lines for this file. Lets the UI show
  // a progress bar / "load more" affordance without a first round-trip.
  uint32 total_lines = 5;
}

// Request a chunk of unified-diff lines for one file in one phase. The
// SPA paginates by line offset; typical chunk size is ~200 lines.
message GetFileDiffRequest {
  string task_id = 1;
  // Event id of the decision that authored this file's edits — same
  // value as `DiffGroup.decision_evt_id`.
  uint64 group_evt_id = 2;
  string path = 3;
  // First diff line to return, 0-based. Use 0 for the initial chunk.
  uint32 offset_lines = 4;
  // Maximum number of diff lines to return in this chunk. Server may
  // return fewer when the file ends. 0 → server picks a default.
  uint32 max_lines = 5;
}

message FileDiffChunkBatch {
  string path = 1;
  uint32 offset_lines = 2;
  // Number of diff lines actually returned in `content`.
  uint32 returned_lines = 3;
  // Total diff line count for the file — matches `FileDiff.total_lines`.
  uint32 total_lines = 4;
  // True when `offset_lines + returned_lines < total_lines`.
  bool has_more = 5;
  // The diff fragment, already formatted as unified-diff text. Lines
  // are joined with `\n`; the last line is not terminated. Empty when
  // `total_lines == 0` (no textual diff for this file).
  string content = 6;
}

message CommitPhaseRequest {
  string task_id = 1;
  int64 decision_evt_id = 2;
  // Optional user-edited commit subject; if empty the daemon synthesizes
  // one from the first line of `decision_text`.
  string subject = 3;
}

message CommitInfo {
  string commit_sha = 1;
  string branch = 2;
  string subject = 3;
  int64 ts_micros = 4;
}

// ---------- M9: Memory promotion ----------

message Memory {
  int64 id = 1;
  // "workdir" → applies only when a task's workdir matches `scope_value`.
  // "global"  → applies everywhere.
  string scope = 2;
  string scope_value = 3;             // workdir path; empty for "global"
  // "pattern" | "preference" | "fact"
  string kind = 4;
  string text = 5;
  // "candidate" | "active" | "forgotten"
  string status = 6;
  // Task that generated this candidate (empty if hand-authored).
  string source_task_id = 7;
  int64 created_at_micros = 8;
  int64 updated_at_micros = 9;
  // Times this memory was actually injected into a task's system prompt.
  uint32 usage_count = 10;
}

message ListMemoriesRequest {
  // Filter by scope (empty = all). "workdir" requires `scope_value`.
  string scope = 1;
  string scope_value = 2;
  // Filter by status. Empty = active + candidate (everything not forgotten).
  string status = 3;
  uint32 limit = 4;
}

message MemoryList {
  repeated Memory memories = 1;
}

message MemoryHandle {
  int64 id = 1;
}

message PromoteMemoryRequest {
  int64 id = 1;
  // Optional override of the proposed text; empty keeps the original.
  string text = 2;
}

message EditMemoryRequest {
  int64 id = 1;
  string text = 2;
  string scope = 3;
  string scope_value = 4;
  string kind = 5;
}

// ---------- M12.S1: Scheduling ----------

message ScheduleSpec {
  // Empty when creating; populated on response. Allows ListSchedules to
  // return ScheduleSpec via a wrapper.
  string id = 1;
  // Cron expression — 5- or 6-field (`* * * * *` or with seconds prefix).
  // Validated server-side via the same parser the scheduler uses.
  string cron = 2;
  string goal = 3;
  string workdir = 4;
  // Optional sandbox/net/routing overrides, same semantics as TaskSpec.
  string sandbox = 5;
  string net_policy = 6;
  string routing_policy = 7;
  // Cap on the child task's agent loop iterations (0 = default).
  uint32 max_steps = 8;
  // Human label shown in the UI ("nightly cargo update", etc.).
  string label = 9;
  // When true, the schedule is paused — it won't fire until set false.
  bool paused = 10;
}

message Schedule {
  ScheduleSpec spec = 1;
  // Unix micros of the last successful enqueue + the next planned run.
  // next_run_micros is 0 when paused or the cron expression has no future.
  int64 last_run_micros = 2;
  int64 next_run_micros = 3;
  // ID of the last task this schedule enqueued (empty if never run).
  string last_task_id = 4;
}

message ScheduleHandle {
  string id = 1;
}

message ScheduleList {
  repeated Schedule schedules = 1;
}
